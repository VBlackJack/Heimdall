name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - name: Check committed line endings
        shell: bash
        run: |
          violations="$(git ls-files --eol | grep -E '^i/(crlf|mixed)' || true)"
          if [ -n "$violations" ]; then
            echo "Committed blobs must be stored with LF (see .gitattributes):"
            echo "$violations"
            echo
            echo "These blobs were committed with CRLF, bypassing the clean filter."
            echo "Do not fix this by replaying the offending commit: a pure"
            echo "line-ending renormalization cannot be rebased, and the branch stays"
            echo "permanently dirty. Regenerate it instead - rebase --onto the target"
            echo "branch, stop after the offending commit, then run"
            echo "git add --renormalize on the offending paths and commit that."
            exit 1
          fi
          echo "All tracked blobs are stored with LF."

      # Placed with the other cheap fail-fast gates, before the SDK is even set
      # up: the typography guard is pure PowerShell over docs/release-notes, so it
      # needs no .NET and no build. Running it here reports a bad character in
      # seconds instead of behind the 25-minute test job. Blocking on purpose - the
      # script exits 1 on the first violation.
      - name: Check release-notes typography
        shell: pwsh
        run: |
          ./scripts/Test-NotesTypographyGuard.ps1
          # The script runs in a child scope, so its `exit 1` does not end this block.
          # GitHub's pwsh wrapper appends an exit-code propagation line, but relying on
          # that leaves the gate depending on runner behaviour invisible in this file.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same reasoning as the gate above: pure PowerShell over Build.ps1 and the
      # application project, no .NET and no build needed. Proves that
      # Build.ps1 -DryRun cannot rewrite the tracked application project file.
      # Scoped to that one file on purpose: a dry run does still rewrite the
      # tracked packages.lock.json files through the publish RID restore, which
      # is a separate known issue, so a green here is not a clean working tree.
      - name: Check dry-run does not rewrite the app project file
        shell: pwsh
        run: |
          ./scripts/Test-DryRunProjectFileGuard.ps1
          # The script runs in a child scope, so its `exit 1` does not end this block.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Heimdall.slnx --locked-mode

      - name: Build (Debug, for format workspace)
        run: dotnet build Heimdall.slnx --no-restore

      - name: Check code formatting
        run: dotnet format Heimdall.slnx --no-restore --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build Heimdall.slnx --no-restore -c Release

      - name: Test with coverage
        timeout-minutes: 25
        run: >
          dotnet test Heimdall.slnx --no-build -c Release
          --filter "Category!=CIUnstable&Category!=RequiresDesktop"
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # Informational pass for tests tagged CIUnstable. These pass on dev
      # machines but flake on the GitHub Actions Windows runner due to
      # named-pipe handshake / WPF binding propagation latency. We surface
      # the result as a workflow warning instead of failing the build, so
      # the signal stays visible without blocking PRs. See
      # docs/CI_FLAKY_TESTS.md for the rationale and the per-test list.
      - name: Test CIUnstable (informational, non-blocking)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: >
          dotnet test Heimdall.slnx --no-build -c Release
          --filter "Category=CIUnstable"
          --verbosity normal
          --results-directory TestResults/CIUnstable

      # Informational pass for desktop UIAutomation smoke tests. These need a
      # real interactive desktop to be deterministic and can hang on GitHub
      # Actions Windows runners. Keep the signal visible without blocking CI.
      - name: Test RequiresDesktop (informational, non-blocking)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: >
          dotnet test Heimdall.slnx --no-build -c Release
          --filter "Category=RequiresDesktop"
          --verbosity normal
          --results-directory TestResults/RequiresDesktop

      - name: Check for vulnerable dependencies
        shell: pwsh
        # Informational only — emits a workflow warning instead of failing the
        # build, since vulnerability databases occasionally include false
        # positives or advisories without an upgrade path. Maintainers should
        # review the warning and act accordingly.
        run: |
          $report = dotnet list Heimdall.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($report -match "has the following vulnerable packages") {
            Write-Host "::warning::Vulnerable dependencies detected - see output above"
          } else {
            Write-Host "No vulnerable dependencies detected."
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 30

      - name: Validate JSON locales
        shell: pwsh
        run: |
          $en = Get-Content locales/en.json -Raw | ConvertFrom-Json
          $fr = Get-Content locales/fr.json -Raw | ConvertFrom-Json
          $enKeys = ($en.PSObject.Properties | Measure-Object).Count
          $frKeys = ($fr.PSObject.Properties | Measure-Object).Count
          Write-Host "EN: $enKeys keys, FR: $frKeys keys"
          if ($enKeys -ne $frKeys) { throw "i18n key parity mismatch: EN=$enKeys FR=$frKeys" }
          $enSorted = $en.PSObject.Properties.Name | Sort-Object
          $frSorted = $fr.PSObject.Properties.Name | Sort-Object
          $diff = Compare-Object $enSorted $frSorted
          if ($diff) {
            $diff | ForEach-Object { Write-Host "$($_.SideIndicator) $($_.InputObject)" }
            throw "i18n key sets differ"
          }
          Write-Host "i18n parity OK ($enKeys keys)"
