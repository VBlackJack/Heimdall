name: CI

on:
  push:
    branches: [main, master, develop]
  # Deliberately unfiltered. A `branches:` list here exempts every pull request
  # whose base is a topic branch, which is how a stack of five review-sized pull
  # requests ended up with four of them carrying no checks at all. A pull request
  # that runs nothing is worse than no pull request: it reads as reviewed.
  pull_request:

# Read-only by default: no job here writes to the repository, so the token a step
# receives (and any script a step runs) cannot push, tag or edit a release. A job
# that needs more declares it itself.
permissions:
  contents: read

# One run per pull request: a new push to the same pull request replaces the run
# in progress. A push to a branch is never cancelled (the group is the commit), so
# the CI conclusion the release preflight reads is always a finished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026
    # The step timeouts below add up to 55 minutes, before the restore and the two
    # builds; this is the bound for a run that hangs where no step timeout reaches.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Measures the bytes of the indexed blobs, not only the `i/` column of
      # `git ls-files --eol`: a blob git classes binary from its content (a lone
      # carriage return is enough) is never normalized and never reported as
      # `i/crlf`, so the one-line grep this step used to be had a blind spot on
      # exactly the kind of data file one adds to a repository (BL-0100).
      - name: Check committed line endings
        shell: pwsh
        run: |
          ./scripts/CommittedLineEndingsGuard.ps1
          # The script runs in a child scope, so its `exit 1` does not end this block.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # And the guard's own suite, so a gate that stopped seeing fails under its
      # own name rather than staying silently green.
      - name: Check the line-endings guard sees what it must
        shell: pwsh
        run: |
          ./scripts/Test-CommittedLineEndingsGuard.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The informational-lane reporter is the only thing that will ever say a
      # test failed in a lane that cannot turn this run red, so a version of it
      # that silently reports nothing would restore the blind spot it removes.
      # Its suite runs here, blocking, over throwaway TRX fixtures: no .NET, no
      # build, a second at most.
      - name: Check the informational-lane reporter sees what it must
        shell: pwsh
        run: |
          ./scripts/Test-InformationalTestFailures.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The release-time reader of the same lanes: a release is not refused for them,
      # but a failure that CI called green is written into the release notes and
      # printed. Pure PowerShell over recorded gh replies and TRX fixtures; if it
      # stopped reading, a release would ship a red lane without a word.
      - name: Check the release reads the informational lanes
        shell: pwsh
        run: |
          ./scripts/Test-InformationalLaneReport.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Placed with the other cheap fail-fast gates, before the SDK is even set
      # up: the typography guard is pure PowerShell over docs/release-notes, so it
      # needs no .NET and no build. Running it here reports a bad character in
      # seconds instead of behind the 25-minute test job. Blocking on purpose - the
      # script exits 1 on the first violation.
      - name: Check release-notes typography
        shell: pwsh
        run: |
          ./scripts/Test-NotesTypographyGuard.ps1
          # The script runs in a child scope, so its `exit 1` does not end this block.
          # GitHub's pwsh wrapper appends an exit-code propagation line, but relying on
          # that leaves the gate depending on runner behaviour invisible in this file.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The rule that decides which files of the installer directory a publish uploads.
      # A release writes its own notes into that directory, so a second publish of one
      # build number used to carry the release body into the asset list.
      - name: Check the publish artifact selection
        shell: pwsh
        run: |
          ./scripts/Test-PublishArtifactSelection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pure PowerShell over Build.ps1 and a temporary notes sandbox. Keep this
      # fail-fast gate beside the typography guard: a missing hand-written notes
      # file must stop a release before the .NET setup and long build/test job.
      - name: Check release-notes requirement
        shell: pwsh
        run: |
          ./scripts/Test-ReleaseNotesRequirement.ps1
          # The script runs in a child scope, so propagate its explicit exit code.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Same reasoning as the gate above: pure PowerShell over Build.ps1 and the
      # application project, no .NET and no build needed. Proves that
      # Build.ps1 -DryRun cannot rewrite the tracked application project file.
      - name: Check dry-run does not rewrite the app project file
        shell: pwsh
        run: |
          ./scripts/Test-DryRunProjectFileGuard.ps1
          # The script runs in a child scope, so its `exit 1` does not end this block.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pure PowerShell. The MSI ProductVersion used to be 1.0.MMDD.xx: Windows
      # Installer compares three fields, so the year was lost and the first 2027
      # build would have been refused by MajorUpgrade as older.
      - name: Check the MSI version increases with the build number
        shell: pwsh
        run: |
          ./scripts/Test-MsiProductVersion.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pure PowerShell over fixture manifests and CABs built on the runner. The
      # SelfContained edition once shipped a seven-month-old WebView2 runtime, and a
      # Release without one dropped the edition in silence.
      - name: Check the WebView2 runtime gate
        shell: pwsh
        run: |
          ./scripts/Test-WebView2RuntimeGate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pure PowerShell over fixture signatures: Setup-WebView2.ps1 runs a downloaded
      # bootstrapper only from a private folder and only when Microsoft Corporation
      # signed it.
      - name: Check the verified installer helpers
        shell: pwsh
        run: |
          ./scripts/Test-VerifiedInstaller.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pure PowerShell over recorded git and gh outputs: a release ships only a
      # clean master that origin and CI agree on, and its tag is pinned.
      - name: Check the release preflight
        shell: pwsh
        run: |
          ./scripts/Test-ReleasePreflight.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      # Pure PowerShell, no .NET and no build needed. Proves the build's staging
      # copy is idempotent and that its cleanup reaches trees deeper than MAX_PATH.
      # Both defects were live at once on 2026-08-22: the cleanup silently failed on
      # the bundled node_modules trees, so the copy nested, so the next build failed
      # harder. A release was abandoned over it.
      - name: Check the build staging copy is idempotent
        shell: pwsh
        run: |
          ./scripts/Test-BuildTreeCopy.ps1
          # The script runs in a child scope, so its `exit 1` does not end this block.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pure PowerShell, no .NET needed. Proves the build's test step survives a failing
      # run under 'Stop' and keeps its output: it used to die on xUnit's first [FAIL]
      # line, before printing the failure, so a red gate never said why.
      - name: Check the build keeps a failing test run's output
        shell: pwsh
        run: |
          ./scripts/Test-NativeCommandLogging.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pure batch and PowerShell. Build.bat and Test.bat ended in a bare `pause`, which
      # succeeds, so a red build or test run left them exiting 0 for any caller.
      - name: Check the batch files pass their failure on
        shell: pwsh
        run: |
          ./scripts/Test-BatchExitCodes.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pure PowerShell over a stand-in compiler. A failed Inno Setup compile used to be
      # piped into Out-Null, so the build said it failed and never said why.
      - name: Check the Inno Setup compile keeps the compiler output
        shell: pwsh
        run: |
          ./scripts/Test-InnoSetupCompile.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pure PowerShell. The readers of the toolchain a Release is built with (SDK, the
      # runtime a self-contained publish carries, the pinned WiX CLI).
      - name: Check the build toolchain readers
        shell: pwsh
        run: |
          ./scripts/Test-BuildToolchain.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The verdict of the npm audit step below, on recorded npm audit JSON shapes and
      # on the recorded real report. Pure PowerShell, no network, no node.
      - name: Check the npm audit verdict
        shell: pwsh
        run: |
          ./scripts/Test-NpmAuditVerdict.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Heimdall.slnx --locked-mode

      - name: Build (Debug, for format workspace)
        run: dotnet build Heimdall.slnx --no-restore

      - name: Check code formatting
        run: dotnet format Heimdall.slnx --no-restore --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build Heimdall.slnx --no-restore -c Release

      - name: Test with coverage
        timeout-minutes: 25
        run: >
          dotnet test Heimdall.slnx --no-build -c Release
          --filter "Category!=CIUnstable&Category!=RequiresDesktop"
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --logger trx
          --results-directory TestResults

      # Informational pass for tests tagged CIUnstable. These pass on dev
      # machines but flake on the GitHub Actions Windows runner due to
      # named-pipe handshake / WPF binding propagation latency. We surface
      # the result as a workflow warning instead of failing the build, so
      # the signal stays visible without blocking PRs. See
      # docs/CI_FLAKY_TESTS.md for the rationale and the per-test list.
      - name: Test CIUnstable (informational, non-blocking)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: >
          dotnet test Heimdall.slnx --no-build -c Release
          --filter "Category=CIUnstable"
          --verbosity normal
          --logger trx
          --results-directory TestResults/CIUnstable

      # Informational pass for desktop UIAutomation smoke tests. These need a
      # real interactive desktop to be deterministic and can hang on GitHub
      # Actions Windows runners. Keep the signal visible without blocking CI.
      # The tests that launch the real executable are opt-in: on a developer
      # machine they run against the developer's own profile. The runner's
      # profile is thrown away with it, so this lane opts in.
      - name: Test RequiresDesktop (informational, non-blocking)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          HEIMDALL_UITESTS_LAUNCH_PRODUCT: "1"
        run: >
          dotnet test Heimdall.slnx --no-build -c Release
          --filter "Category=RequiresDesktop"
          --verbosity normal
          --logger trx
          --results-directory TestResults/RequiresDesktop

      # Both lanes above are `continue-on-error`, so a test that fails in them
      # leaves this run at `conclusion: success` and no step marked red. The only
      # trace is the TRX inside the test-results artifact, which somebody has to
      # download and parse on purpose. Measured on 2026-09-07 across the 99 green
      # runs since 2026-08-26: seven failed tests inside runs GitHub called
      # successful, one of them the occurrence BL-0067 had been waiting a
      # fortnight for, on master, in a release run. This step changes nothing
      # about what blocks; it makes those lanes audible in the run summary.
      - name: Report informational lane failures
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/InformationalTestFailures.ps1 -ResultsRoot TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The verdict of the vulnerable-dependency step below, on recorded report
      # shapes, plus the step script on a solution that does not exist and on this
      # one. After the SDK setup and restore, since it runs dotnet.
      - name: Check the vulnerable-dependency verdict
        shell: pwsh
        run: |
          ./scripts/Test-VulnerableDependencyReport.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # A vulnerable package stays a workflow warning, since vulnerability databases
      # occasionally include false positives or advisories without an upgrade path;
      # maintainers review it and act accordingly. A scan that did not run to
      # completion fails the step: it used to ignore the exit code and print "No
      # vulnerable dependencies detected." over a failed restore.
      - name: Check for vulnerable dependencies
        shell: pwsh
        run: |
          ./scripts/Invoke-VulnerableDependencyCheck.ps1 -Solution Heimdall.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # NuGet's scan cannot see the npm dependencies baked into the committed milkdown
      # bundle (dist/index.html). The audit reads package-lock.json alone, so no install.
      # Below high it only warns; at high or critical it fails, except for the advisories
      # that were already in the lock, listed with a reason in npm-audit-baseline.json
      # next to it. A registry that cannot be reached fails the step: silence is not clean.
      - name: Audit the milkdown editor npm dependencies
        shell: pwsh
        run: |
          ./scripts/Invoke-NpmAuditCheck.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # One file per test assembly. The console stream interleaves assemblies
      # running in parallel, which tears a failure's name, message and stack
      # trace apart and glues fragments of one onto another - a failing run
      # then names the wrong test. These stay readable.
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 30
