version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # The Microsoft.* and System.* packages ship from the same servicing train:
    # their patch releases move together, so they arrive as one pull request
    # instead of one per package. Minor and major updates stay individual.
    groups:
      microsoft-patch:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "patch"
    # WiX 7 requires the person running it to accept the Open Source Maintenance Fee
    # EULA before any command runs. Accepting a license agreement is the owner's decision,
    # not an automated pull request's, so the major line stays on 6.x. Minor and patch
    # updates of WiX 6 still arrive. Remove this entry only once the owner has accepted
    # the EULA and moved .config/dotnet-tools.json to 7.x by hand.
    ignore:
      - dependency-name: "wix"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "WixToolset.*"
        update-types:
          - "version-update:semver-major"
      # FluentAssertions 8 left Apache 2.0 for the Xceed community license, which asks
      # for a paid license in commercial use. The 7.x line is still Apache 2.0 and stays
      # open. Same rule as WiX: a license change is the owner's decision.
      - dependency-name: "FluentAssertions"
        versions:
          - ">= 8.0.0"
      # JsonSchema.Net 9 ships under an Open Source Maintenance Fee agreement and changes
      # the API used by JsonSchemaValidator. The 8.x line was not examined, so every major
      # update is held back until the owner has read its license.
      - dependency-name: "JsonSchema.Net"
        update-types:
          - "version-update:semver-major"
      # The Microsoft.* and System.* packages follow the .NET release they ship with. The
      # solution targets net10.0, so their 11.x line belongs to the move to .NET 11, which
      # is one decision for the whole solution and not one pull request per package.
      # Remove these two entries when the target framework moves.
      - dependency-name: "Microsoft.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "System.*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
