<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; frame-src 'none';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heimdall Terminal</title>
    <style>
        :root {
            --terminal-bg: /*{{CSS_BG}}*/;
            --terminal-fg: /*{{CSS_FG}}*/;
            --terminal-cursor: /*{{CSS_CURSOR}}*/;
            --terminal-selection: /*{{CSS_SELECTION}}*/;
            /* Search bar colours, derived from the active scheme by TerminalSearchChrome */
            --search-bar-bg: /*{{CSS_SEARCH_BAR_BG}}*/;
            --search-input-bg: /*{{CSS_SEARCH_INPUT_BG}}*/;
            --search-hover-bg: /*{{CSS_SEARCH_HOVER_BG}}*/;
            --search-text: /*{{CSS_SEARCH_TEXT}}*/;
            --search-border: /*{{CSS_SEARCH_BORDER}}*/;
            --search-focus: /*{{CSS_SEARCH_FOCUS}}*/;
            --search-no-match-text: /*{{CSS_SEARCH_NO_MATCH_TEXT}}*/;
            --search-no-match-border: /*{{CSS_SEARCH_NO_MATCH_BORDER}}*/;
            --loading-text: /*{{CSS_LOADING_TEXT}}*/;
            --scrollbar-track: /*{{CSS_SCROLLBAR_TRACK}}*/;
            --scrollbar-thumb: /*{{CSS_SCROLLBAR_THUMB}}*/;
            --scrollbar-thumb-hover: /*{{CSS_SCROLLBAR_THUMB_HOVER}}*/;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--terminal-bg);
            color: var(--terminal-fg);
            font-family: /*{{TERMINAL_FONT_FAMILY}}*/, 'Courier New', monospace;
        }

        body {
            display: flex;
        }

        #terminal {
            width: 100%;
            height: 100%;
            background: var(--terminal-bg);
            border: 0;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--terminal-bg);
            color: var(--loading-text);
            font-size: 13px;
            letter-spacing: 0.02em;
        }

        /* Search bar overlay */
        #search-bar {
            display: none;
            position: absolute;
            top: 4px;
            right: 12px;
            z-index: 100;
            background: var(--search-bar-bg);
            border: 1px solid var(--search-border);
            border-radius: 6px;
            padding: 4px 8px;
            align-items: center;
            gap: 4px;
        }

        #search-bar.visible {
            display: flex;
        }

        #search-input {
            background: var(--search-input-bg);
            color: var(--search-text);
            border: 1px solid var(--search-border);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 12px;
            font-family: Consolas, monospace;
            width: 220px;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--search-focus);
        }

        #search-input.no-match {
            border-color: var(--search-no-match-border);
        }

        #search-status {
            color: var(--search-text);
            font-size: 11px;
            min-width: 48px;
            text-align: center;
            white-space: nowrap;
        }

        #search-status.no-match {
            color: var(--search-no-match-text);
        }

        .search-btn {
            background: var(--search-bar-bg);
            color: var(--search-text);
            border: 1px solid var(--search-border);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .search-btn:hover {
            background: var(--search-hover-bg);
        }

        .xterm,
        .xterm .xterm-screen,
        .xterm .xterm-viewport {
            background: var(--terminal-bg);
        }

        .xterm {
            height: 100%;
            padding: 4px;
        }

        /* Scrollbar for xterm viewport, coloured from the active scheme */
        .xterm .xterm-viewport::-webkit-scrollbar {
            width: 10px;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        .xterm .xterm-viewport::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 5px;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }
    </style>
    <link rel="stylesheet" href="./Terminal/xterm.min.css" />
    <script src="./Terminal/xterm.min.js"></script>
    <script src="./Terminal/addon-fit.min.js"></script>
    <script src="./Terminal/addon-webgl.min.js"></script>
</head>
<body>
    <div id="loading">Initializing terminal&#x2026;</div>
    <div id="search-bar" role="search">
        <input id="search-input" type="text" placeholder="Search..." aria-label="Search..." />
        <span id="search-status" role="status" aria-live="polite"></span>
        <button class="search-btn" id="search-prev" title="{{TERMINAL_SEARCH_PREVIOUS_LABEL}}" aria-label="{{TERMINAL_SEARCH_PREVIOUS_LABEL}}">&#x25B2;</button>
        <button class="search-btn" id="search-next" title="{{TERMINAL_SEARCH_NEXT_LABEL}}" aria-label="{{TERMINAL_SEARCH_NEXT_LABEL}}">&#x25BC;</button>
        <button class="search-btn" id="search-close" title="{{TERMINAL_SEARCH_CLOSE_LABEL}}" aria-label="{{TERMINAL_SEARCH_CLOSE_LABEL}}">&#x2715;</button>
    </div>
    <div id="terminal"></div>
    <script>
        (function () {
            'use strict';

            var terminalElement = document.getElementById('terminal');
            var loadingElement = document.getElementById('loading');
            var searchBar = document.getElementById('search-bar');
            var searchInput = document.getElementById('search-input');
            var term = null;
            var fitAddon = null;
            var ready = false;
            var pendingHostMessages = [];
            var pendingResizeHandle = 0;
            var baseFontSize = /*{{TERMINAL_FONT_SIZE}}*/;
            var fontSizeMin = /*{{TERMINAL_FONT_MIN}}*/;
            var fontSizeMax = /*{{TERMINAL_FONT_MAX}}*/;
            var currentFontSize = baseFontSize;
            var resizeDebounceMilliseconds = 60;
            var scrollbackLines = 10000;
            // Largest UTF-8 text a buffer reply carries; mirrors TerminalBufferReadCoordinator.PageMaxTextBytes.
            var bufferMaxBytes = 4 * 1024 * 1024;
            // Bytes handed to String.fromCharCode at once when encoding a buffer reply.
            var base64ChunkBytes = 32 * 1024;
            // keyCode of the M key, the key of the host's masked-copy chord (Ctrl+Shift+M).
            var maskedCopyKeyCode = 77;
            // keyCode of the L key, the key of the save-to-library chord (Ctrl+Shift+L).
            var libraryCaptureKeyCode = 76;
            var utf8ContinuationMask = 0xC0;
            var utf8ContinuationBits = 0x80;
            var searchContextRows = 5;
            var searchStatusElement = document.getElementById('search-status');
            var searchNoResultsText = /*{{TERMINAL_SEARCH_NO_RESULTS_LITERAL}}*/;
            var searchCountFormat = /*{{TERMINAL_SEARCH_COUNT_FORMAT_LITERAL}}*/;
            var suppressSelectionCopy = false;
            var sessionEndedMarked = 'marked';
            var sessionEndedText = /*{{TERMINAL_SESSION_ENDED_LITERAL}}*/;
            var sessionEndedColor = '\x1b[33m';
            var searchMatches = [];
            var searchMatchIndex = -1;
            var searchSnapshotQuery = '';
            var searchSnapshotLength = -1;
            var urlPattern = /https?:\/\/[^\s<>"'`]+/g;
            var urlTrailingPunctuation = /[.,;:!?)\]}]+$/;

            function postMessage(message) {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(message);
                }
            }

            function bytesToBase64(bytes) {
                var binary = '';
                for (var index = 0; index < bytes.length; index++) {
                    binary += String.fromCharCode(bytes[index]);
                }
                return btoa(binary);
            }

            function base64ToBytes(base64) {
                var binary = atob(base64);
                var bytes = new Uint8Array(binary.length);
                for (var index = 0; index < binary.length; index++) {
                    bytes[index] = binary.charCodeAt(index);
                }
                return bytes;
            }

            function stringToBase64(text) {
                return bytesToBase64(new TextEncoder().encode(text));
            }

            // bytesToBase64 appends one character at a time, which freezes the renderer on
            // megabytes; this one converts slices and joins them once.
            function bytesToBase64Chunked(bytes) {
                var parts = [];
                for (var offset = 0; offset < bytes.length; offset += base64ChunkBytes) {
                    parts.push(String.fromCharCode.apply(null, bytes.subarray(offset, offset + base64ChunkBytes)));
                }
                return btoa(parts.join(''));
            }

            // Text of the normal buffer (not the active one: a full-screen program such as vim or
            // less would otherwise give its own screen). A wrapped row is joined to the previous
            // one without a newline so a long token comes back whole; logical lines are joined
            // with \n and the trailing blank ones dropped. Also reports whether the first logical
            // line is headless: its first row is a wrapped row, so the start of that line was
            // evicted from the scrollback.
            function readNormalBufferText() {
                var buffer = term.buffer.normal;
                var logicalLines = [];
                var firstLineHeadless = buffer.length > 0 && !!buffer.getLine(0) && buffer.getLine(0).isWrapped;
                for (var row = 0; row < buffer.length; row++) {
                    var line = buffer.getLine(row);
                    if (!line) {
                        continue;
                    }
                    var next = row + 1 < buffer.length ? buffer.getLine(row + 1) : null;
                    // Trailing blanks are trimmed only on the last row of a logical line: on a
                    // wrapped row they can be the space between two words.
                    var rowText = line.translateToString(!(next && next.isWrapped));
                    if (line.isWrapped && logicalLines.length > 0) {
                        logicalLines[logicalLines.length - 1] += rowText;
                    } else {
                        logicalLines.push(rowText);
                    }
                }
                while (logicalLines.length > 0 && logicalLines[logicalLines.length - 1] === '') {
                    logicalLines.pop();
                }
                return { text: logicalLines.join('\n'), firstLineHeadless: firstLineHeadless };
            }

            // Encodes the text, keeping the tail (most recent output) when it is over the cap.
            // The truncated flag is also set when the first line is headless: in both cases the
            // text starts in the middle of a line, and the host drops that partial first line
            // (TerminalBufferReadCoordinator) so a secret whose key was cut away cannot survive.
            function encodeBufferText(read) {
                var bytes = new TextEncoder().encode(read.text);
                var truncated = read.firstLineHeadless;
                if (bytes.length > bufferMaxBytes) {
                    var start = bytes.length - bufferMaxBytes;
                    // Do not start in the middle of a multi-byte character.
                    while (start < bytes.length && (bytes[start] & utf8ContinuationMask) === utf8ContinuationBits) {
                        start++;
                    }
                    bytes = bytes.subarray(start);
                    truncated = true;
                }
                return { base64: bytesToBase64Chunked(bytes), truncated: truncated };
            }

            function tryParseOsc7Path(data) {
                try {
                    if (!data || data.indexOf('file://') !== 0) {
                        return null;
                    }

                    var rest = data.substring('file://'.length);
                    var pathStart = rest.indexOf('/');
                    if (pathStart < 0) {
                        return null;
                    }

                    var encodedPath = rest.substring(pathStart);
                    if (!encodedPath) {
                        return null;
                    }

                    var path = decodeURIComponent(encodedPath);
                    return path || null;
                }
                catch (error) {
                    return null;
                }
            }

            function fitTerminal() {
                if (!fitAddon || !term) {
                    return;
                }
                // The new size reaches the host through term.onResize; posting it here as
                // well would send two messages for every change of size.
                fitAddon.fit();
            }

            function setFontSize(size) {
                size = Math.max(fontSizeMin, Math.min(fontSizeMax, size));
                currentFontSize = size;
                term.options.fontSize = size;
                fitTerminal();
            }

            // ── Search ──────────────────────────────────────────────
            function toggleSearch() {
                if (searchBar.classList.contains('visible')) {
                    closeSearch();
                } else {
                    searchBar.classList.add('visible');
                    searchInput.focus();
                    searchInput.select();
                }
            }

            function closeSearch() {
                searchBar.classList.remove('visible');
                resetSearchState();
                if (term) {
                    term.clearSelection();
                    term.focus();
                }
            }

            function resetSearchState() {
                searchMatches = [];
                searchMatchIndex = -1;
                searchSnapshotQuery = '';
                searchSnapshotLength = -1;
                setSearchStatus('', false);
            }

            function setSearchStatus(text, noMatch) {
                searchStatusElement.textContent = text;
                searchStatusElement.classList.toggle('no-match', noMatch);
                searchInput.classList.toggle('no-match', noMatch);
            }

            // Collects every case-insensitive occurrence of the query in the whole buffer,
            // wrapped lines included, so the same list serves next and previous.
            function collectSearchMatches(query) {
                var buffer = term.buffer.active;
                var needle = query.toLowerCase();
                var matches = [];
                for (var row = 0; row < buffer.length; row++) {
                    var line = buffer.getLine(row);
                    if (!line) {
                        continue;
                    }
                    var text = line.translateToString(true).toLowerCase();
                    var column = text.indexOf(needle);
                    while (column >= 0) {
                        matches.push({ row: row, column: column, length: needle.length });
                        column = text.indexOf(needle, column + needle.length);
                    }
                }
                return matches;
            }

            function doSearch(direction) {
                if (!term || !searchInput.value) {
                    resetSearchState();
                    return;
                }

                var query = searchInput.value;
                var bufferLength = term.buffer.active.length;
                if (query !== searchSnapshotQuery || bufferLength !== searchSnapshotLength) {
                    searchMatches = collectSearchMatches(query);
                    searchSnapshotQuery = query;
                    searchSnapshotLength = bufferLength;
                    searchMatchIndex = -1;
                }

                if (searchMatches.length === 0) {
                    term.clearSelection();
                    setSearchStatus(searchNoResultsText, true);
                    return;
                }

                // The first press lands on the first match at or after the viewport top
                // (last one before it for 'prev'); later presses step and wrap around.
                if (searchMatchIndex < 0) {
                    var top = term.buffer.active.viewportY;
                    var start = 0;
                    if (direction === 'prev') {
                        start = searchMatches.length - 1;
                        for (var back = searchMatches.length - 1; back >= 0; back--) {
                            if (searchMatches[back].row < top) {
                                start = back;
                                break;
                            }
                        }
                    }
                    else {
                        for (var forward = 0; forward < searchMatches.length; forward++) {
                            if (searchMatches[forward].row >= top) {
                                start = forward;
                                break;
                            }
                        }
                    }
                    searchMatchIndex = start;
                }
                else {
                    var delta = direction === 'prev' ? -1 : 1;
                    searchMatchIndex = (searchMatchIndex + delta + searchMatches.length) % searchMatches.length;
                }

                var match = searchMatches[searchMatchIndex];
                suppressSelectionCopy = true;
                term.select(match.column, match.row, match.length);
                suppressSelectionCopy = false;
                term.scrollToLine(Math.max(0, match.row - searchContextRows));
                setSearchStatus(
                    searchCountFormat
                        .replace('{0}', String(searchMatchIndex + 1))
                        .replace('{1}', String(searchMatches.length)),
                    false);
            }

            // Plain URLs printed by git, curl, kubectl and the like. A Ctrl+click opens them
            // through the host, which applies its own external URL policy.
            function registerUrlLinkProvider() {
                term.registerLinkProvider({
                    provideLinks: function (lineNumber, callback) {
                        var line = term.buffer.active.getLine(lineNumber - 1);
                        if (!line) {
                            callback(undefined);
                            return;
                        }
                        var text = line.translateToString(true);
                        var links = [];
                        urlPattern.lastIndex = 0;
                        var found;
                        while ((found = urlPattern.exec(text)) !== null) {
                            var uri = found[0].replace(urlTrailingPunctuation, '');
                            if (!uri) {
                                continue;
                            }
                            links.push({
                                range: {
                                    start: { x: found.index + 1, y: lineNumber },
                                    end: { x: found.index + uri.length, y: lineNumber }
                                },
                                text: uri,
                                activate: function (event, linkText) {
                                    if (event.ctrlKey || event.metaKey) {
                                        postMessage('open-url:' + linkText);
                                    }
                                }
                            });
                        }
                        callback(links.length > 0 ? links : undefined);
                    }
                });
            }

            // Re-applies the localized texts after a language change; the page itself is built
            // once, so the host sends the new labels instead of rebuilding it.
            function applyLabels(labels) {
                searchInput.placeholder = labels.placeholder;
                searchInput.setAttribute('aria-label', labels.placeholder);
                [['search-prev', labels.previous], ['search-next', labels.next], ['search-close', labels.close]]
                    .forEach(function (pair) {
                        var button = document.getElementById(pair[0]);
                        button.title = pair[1];
                        button.setAttribute('aria-label', pair[1]);
                    });
                searchNoResultsText = labels.noResults;
                searchCountFormat = labels.countFormat;
                sessionEndedText = labels.sessionEnded;
            }

            // ── Host message handling ────────────────────────────────
            function handleHostMessage(message) {
                if (!term || typeof message !== 'string') {
                    return;
                }

                if (message.indexOf('data:') === 0) {
                    window.writeTerminal(message.substring(5));
                    return;
                }

                if (message.indexOf('set-convert-eol:') === 0) {
                    term.options.convertEol = message.substring('set-convert-eol:'.length) === 'true';
                    return;
                }

                if (message.indexOf('clipboard-paste:') === 0) {
                    var pasteB64 = message.substring('clipboard-paste:'.length);
                    if (pasteB64) {
                        var pasteText = new TextDecoder().decode(base64ToBytes(pasteB64));
                        // Through xterm's own paste path, not as raw keystrokes: it wraps the
                        // text in bracketed-paste markers when the shell enabled mode 2004 and
                        // folds CR+LF into a single line ending, so a Windows clipboard does not
                        // submit an empty line after the pasted one.
                        term.paste(pasteText);
                    }
                    return;
                }

                if (message.indexOf('session-ended:') === 0) {
                    // The host writes its own marker, with the reason, when it has one; the
                    // page adds the generic line only when the host has not.
                    if (message.substring('session-ended:'.length) !== sessionEndedMarked) {
                        term.write('\r\n' + sessionEndedColor + sessionEndedText + '\x1b[0m\r\n');
                    }
                    term.options.disableStdin = true;
                    return;
                }

                if (message.indexOf('set-labels:') === 0) {
                    applyLabels(JSON.parse(message.substring('set-labels:'.length)));
                    return;
                }

                if (message.indexOf('buffer-request:') === 0) {
                    var requestId = message.substring('buffer-request:'.length);
                    // No reply for an id that is not a plain number or when reading fails: the
                    // host ends that request on its timeout.
                    if (/^[0-9]+$/.test(requestId)) {
                        try {
                            var encoded = encodeBufferText(readNormalBufferText());
                            postMessage('buffer:' + requestId + ':' + (encoded.truncated ? '1' : '0') + ':' + encoded.base64);
                        } catch (error) {
                            // Left to the host timeout.
                        }
                    }
                    return;
                }

                if (message.indexOf('focus:') === 0) {
                    term.focus();
                }
            }

            function flushPendingHostMessages() {
                if (!ready) {
                    return;
                }
                while (pendingHostMessages.length > 0) {
                    handleHostMessage(pendingHostMessages.shift());
                }
            }

            // ── Terminal initialization ──────────────────────────────
            function initializeTerminal() {
                term = new Terminal({
                    allowProposedApi: true,
                    convertEol: /*{{TERMINAL_CONVERT_EOL}}*/,
                    cursorBlink: !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches),
                    cursorStyle: 'block',
                    // Each cell's foreground is raised to this contrast on its background at render time.
                    minimumContrastRatio: /*{{TERMINAL_MIN_CONTRAST}}*/,
                    fontFamily: '/*{{TERMINAL_FONT_FAMILY}}*/, "Courier New", monospace',
                    fontSize: baseFontSize,
                    scrollback: scrollbackLines,
                    linkHandler: {
                        activate: function (event, uri) {
                            postMessage('open-url:' + uri);
                        }
                    },
                    theme: /*{{TERMINAL_THEME}}*/
                });

                fitAddon = new FitAddon.FitAddon();
                term.loadAddon(fitAddon);

                try {
                    var webglAddon = new WebglAddon.WebglAddon();
                    webglAddon.onContextLoss(function () {
                        webglAddon.dispose();
                    });
                    term.loadAddon(webglAddon);
                }
                catch (error) {
                    // Canvas fallback is acceptable.
                }

                term.open(terminalElement);
                fitTerminal();
                loadingElement.style.display = 'none';

                // ── Input handling ───────────────────────────────────
                term.onData(function (data) {
                    postMessage('input:' + stringToBase64(data));
                });

                term.onResize(function (size) {
                    postMessage('resize:' + size.cols + ',' + size.rows);
                });

                if (typeof term.registerOscHandler === 'function') {
                    term.registerOscHandler(7, function (data) {
                        var path = tryParseOsc7Path(data);
                        if (path) {
                            postMessage('cwd:' + stringToBase64(path));
                        }
                        return true;
                    });
                }

                // ── Selection auto-copy (via C# host for clipboard access) ──
                term.onSelectionChange(function () {
                    if (suppressSelectionCopy) {
                        return;
                    }
                    var selection = term.getSelection();
                    if (selection && selection.length > 0) {
                        postMessage('clipboard-write:' + stringToBase64(selection));
                    }
                });

                // ── Keyboard shortcuts ──────────────────────────────
                term.attachCustomKeyEventHandler(function (event) {
                    if (event.type !== 'keydown') return true;

                    // Tab: prevent browser focus navigation, let xterm.js send \t to terminal
                    // This is critical for PowerShell/bash tab completion
                    if (event.key === 'Tab') {
                        event.preventDefault();
                        return true;
                    }

                    // Ctrl+Alt+Home, as on RDP: hand the keyboard back to the session header (WCAG 2.1.2)
                    if (event.ctrlKey && event.altKey && !event.shiftKey && !event.metaKey && event.key === 'Home') {
                        event.preventDefault();
                        postMessage('release-focus:');
                        return false;
                    }

                    // Ctrl+Shift+C: explicit copy
                    if (event.ctrlKey && event.shiftKey && event.code === 'KeyC') {
                        var sel = term.getSelection();
                        if (sel) postMessage('clipboard-write:' + stringToBase64(sel));
                        return false;
                    }

                    // Ctrl+Shift+V or Ctrl+V: paste from host clipboard
                    if (event.ctrlKey && (event.code === 'KeyV')) {
                        event.preventDefault();
                        postMessage('clipboard-read:');
                        return false;
                    }

                    // Shift+Insert: the same host clipboard road as Ctrl+V. Left to the
                    // browser it becomes a native paste into the hidden textarea, which
                    // xterm forwards to the shell without the host's paste guard seeing it.
                    if (event.shiftKey && !event.ctrlKey && !event.altKey && event.code === 'Insert') {
                        event.preventDefault();
                        postMessage('clipboard-read:');
                        return false;
                    }

                    // Ctrl+Shift+M: "Copy output, secrets masked" is the host's command; the host owns
                    // this chord, keep the page inert. keyCode (not code) so that AZERTY layouts match.
                    if (event.ctrlKey && event.shiftKey && !event.altKey && !event.metaKey && event.keyCode === maskedCopyKeyCode) {
                        event.preventDefault();
                        return false;
                    }

                    // Ctrl+Shift+L: hand the selection to the host, which opens the Command Library
                    // editor prefilled with it. keyCode (not code) so that every layout matches.
                    if (event.ctrlKey && event.shiftKey && !event.altKey && !event.metaKey && event.keyCode === libraryCaptureKeyCode) {
                        event.preventDefault();
                        var librarySelection = term.getSelection();
                        if (librarySelection) postMessage('library-save:' + stringToBase64(librarySelection));
                        return false;
                    }

                    // Ctrl+Shift+F: search
                    if (event.ctrlKey && event.shiftKey && event.code === 'KeyF') {
                        toggleSearch();
                        return false;
                    }

                    // Ctrl++ / Ctrl+-: font zoom
                    if (event.ctrlKey && !event.shiftKey && (event.key === '+' || event.key === '=')) {
                        setFontSize(currentFontSize + 1);
                        return false;
                    }
                    if (event.ctrlKey && !event.shiftKey && event.key === '-') {
                        setFontSize(currentFontSize - 1);
                        return false;
                    }
                    if (event.ctrlKey && event.key === '0') {
                        setFontSize(baseFontSize);
                        return false;
                    }

                    return true;
                });

                // ── Mouse wheel zoom (Ctrl+Scroll) ─────────────────
                terminalElement.addEventListener('wheel', function (event) {
                    if (event.ctrlKey) {
                        event.preventDefault();
                        if (event.deltaY < 0) {
                            setFontSize(currentFontSize + 1);
                        } else {
                            setFontSize(currentFontSize - 1);
                        }
                    }
                }, { passive: false });

                // ── Right-click paste (via C# host clipboard) ─────
                // Shift+right-click asks the host for its menu instead, carrying the selection
                // so the menu can tell whether there is anything to save.
                terminalElement.addEventListener('contextmenu', function (event) {
                    event.preventDefault();
                    if (event.shiftKey) {
                        postMessage('library-menu:' + stringToBase64(term.getSelection()));
                        return;
                    }
                    postMessage('clipboard-read:');
                });

                // ── URL detection ───────────────────────────────────
                registerUrlLinkProvider();

                window.writeTerminal = function (base64data) {
                    if (!term || !base64data) {
                        return;
                    }
                    term.write(base64ToBytes(base64data));
                };

                ready = true;
                postMessage('ready:' + term.cols + ',' + term.rows);
                flushPendingHostMessages();
                term.focus();

                new ResizeObserver(function () {
                    if (pendingResizeHandle) {
                        window.clearTimeout(pendingResizeHandle);
                    }
                    pendingResizeHandle = window.setTimeout(function () {
                        fitTerminal();
                    }, resizeDebounceMilliseconds);
                }).observe(terminalElement);
            }

            // ── Search bar events ───────────────────────────────────
            document.getElementById('search-next').addEventListener('click', function () { doSearch('next'); });
            document.getElementById('search-prev').addEventListener('click', function () { doSearch('prev'); });
            document.getElementById('search-close').addEventListener('click', closeSearch);
            searchInput.addEventListener('keydown', function (event) {
                if (event.key === 'Enter') {
                    doSearch(event.shiftKey ? 'prev' : 'next');
                    event.preventDefault();
                }
                if (event.key === 'Escape') {
                    closeSearch();
                    event.preventDefault();
                }
            });

            // ── WebView2 message handler ────────────────────────────
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.addEventListener('message', function (event) {
                    if (!ready) {
                        pendingHostMessages.push(event.data);
                        return;
                    }
                    handleHostMessage(event.data);
                });
            }

            initializeTerminal();
        }());
    </script>
</body>
</html>
